name: Build Examy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare Direct APK Binaries
        run: |
          mkdir -p dist
          # Prioritize the signed, minified release APK for smaller size
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk dist/Examy.apk
          else
            cp app/build/outputs/apk/debug/*-debug.apk dist/Examy.apk || cp app/build/outputs/apk/debug/*.apk dist/Examy.apk
          fi
          cp dist/Examy.apk dist/Examy-v3.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Examy-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Examy-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases (Versi 3)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Examy v1.0.2 - Operator Santri (Versi 3)"
          body: |
            ### 📱 Unduh Langsung Examy APK Versi 3 (Tanpa ZIP)
            
            Versi terbaru dengan jadwal tanggal & jam terpadu, riwayat sesi ujian, perbaikan teks menu lengkap, dan identitas resmi **Operator Santri**:
            
            - 📥 **[Unduh Examy-v3.apk Langsung](https://github.com/qiraati-sby/examy/releases/download/v1.0.2/Examy-v3.apk)**
            - 📥 **[Unduh Examy.apk (Rilis Utama)](https://github.com/qiraati-sby/examy/releases/download/v1.0.2/Examy.apk)**
            
            ---
            
            #### 🌟 Fitur & Pembaruan Versi 3:
            1. **Pilihan Tema Warna (Theme Switcher)**: Menu kapsul ganti tema instan di halaman utama antara **Tema Klasik** (Indigo & Orange) dan **Tema Santri Lime** (Violet & Neon Lime) yang sejuk di mata.
            2. **Desain Beranda Presisi**: Layout terpusat simetris dan ergonomis mengikuti standar kiosk modern.
            3. **Operator Santri Branding**: Identitas resmi di beranda bawah tengah (Operator hitam, Santri hijau, garis bawah merah).
            4. **Jadwal & Waktu Terpadu**: Tanggal Mulai dan Tanggal Selesai menyatu dengan Jam Mulai dan Jam Selesai (*DatePicker & TimePicker*).
            5. **Riwayat Sesi Ujian Otomatis**: Setiap generate sesi ujian tersimpan di menu riwayat, bisa dibuka ulang QR-nya, disalin tokennya, atau dimuat kembali ke formulir.
            6. **Optimasi Ukuran Berkas**: Pembersihan berkas tidak terpakai dan kompresi rilis untuk ukuran download yang lebih ringan.
          files: dist/*
          generate_release_notes: false
